# dots.toml - declarative dotfiles configuration.
#
# [dots] maps a target path to a source path (relative to this file).
# Quote target paths. "~" is the home directory.
#
#   [dots]
#   "~/.vimrc" = "vim/vimrc"
#
# [dots.<os>] overrides [dots] on one OS (linux, darwin, windows, ...):
#
#   [dots.windows]
#   "~/.vimrc" = "vim/windows-vimrc"
#
# [[auto]] links every file below source into target, optionally skipping
# paths matched by ignore patterns:
#
#   [[auto]]
#   source = "config"
#   target = "~/.config"
#   ignore = ["**/*.bak"]
#
# [[auto.<os>]] adds or overrides rules of an [[auto]] group on one OS:
#
#   [[auto.linux]]
#   source = "linux-config"
#   target = "~/.config"

[dots]
"~/.vimrc" = "config/vimrc"
"~/.gemini/antigravity-cli/settings.json" = "config/agents/gemini/antigravity-cli/settings.json"
"~/.gemini/config/mcp_config.json" = "config/agents/gemini/config/mcp_config.json"
"~/.claude/settings.json" = "config/agents/claude/settings.json"
"~/.claude/CLAUDE.md" = "config/agents/AGENTS-NO_CODEX.md"

[[auto]]
source = "config/shared"
target = "~/.config"
